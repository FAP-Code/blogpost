<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Mono:wght@500&display=swap');
  body { margin: 0; }
  table.flyer {
    width: 1080px;
    height: 1350px;
    background: #0b1f3a;
    border-collapse: collapse;
  }
  table.flyer td {
    padding: 80px 90px;
    vertical-align: middle;
  }
  .kicker {
    font-family: 'DM Mono', monospace;
    color: #c9a227;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
  .headline {
    font-family: 'Playfair Display', serif;
    color: #f7f2e7;
    font-size: 64px;
    line-height: 1.25;
    margin: 30px 0;
  }
  .stat {
    font-family: 'DM Mono', monospace;
    color: #c9a227;
    font-size: 28px;
  }
  .source {
    font-family: 'DM Mono', monospace;
    color: #f7f2e7;
    opacity: 0.6;
    font-size: 18px;
    margin-top: 40px;
  }
</style>
</head>
<body>
<table class="flyer">
  <tr>
    <td>
      <div class="kicker">__KICKER__</div>
      <div class="headline">__HEADLINE__</div>
      <div class="stat">__STAT__</div>
      <div class="source">Source: __SOURCE__</div>
    </td>
  </tr>
</table>
</body>
</html>
