<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="100%" role="img" aria-label="Percentage of annual production exported in raw, unprocessed form, by crop: Cashew Nuts 95%, Natural Rubber 95%, Shea Nuts 90%, Cocoa Beans 70%, Mango approximately 60%, Oil Palm approximately 40%.">
